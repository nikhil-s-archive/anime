name = "animex-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Automatically publish to <name>.<subdomain>.workers.dev
# No custom domain setup required — Cloudflare assigns this on first deploy
workers_dev = true

[vars]
ENVIRONMENT = "production"

# Optional: pin a custom domain after first deploy
# [[routes]]
# pattern = "animex.yourdomain.com/*"
# zone_name = "yourdomain.com"

[dev]
port = 8787
local_protocol = "http"
