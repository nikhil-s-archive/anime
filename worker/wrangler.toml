name = "animex-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[vars]
ENVIRONMENT = "production"

# Uncomment and fill in after `wrangler deploy`
# [[routes]]
# pattern = "animex.yourdomain.com/*"
# zone_name = "yourdomain.com"

# Local dev server port
[dev]
port = 8787
local_protocol = "http"
