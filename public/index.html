<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnymeX Cloudflare Edge Client</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-[#0f1115] text-slate-100 min-h-screen flex flex-col">

    <header class="border-b border-zinc-800 bg-[#12141c] px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-sky-400 flex items-center gap-2">
            ⚡ AnymeX <span class="text-xs bg-orange-500/20 text-orange-400 px-2 py-0.5 rounded-full border border-orange-500/30">Cloudflare Edge</span>
        </h1>
        <span id="statusBadge" class="text-xs text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20">Edge Connected</span>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        <section class="bg-[#18181b] border border-zinc-800 rounded-xl p-4 flex flex-col h-[650px]">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-sm font-semibold text-zinc-400 uppercase tracking-wider">Catalog Feed</h2>
                <button onclick="fetchCatalog()" class="text-xs bg-sky-600 hover:bg-sky-500 text-white px-2.5 py-1.5 rounded-md font-medium transition-all">Reload</button>
            </div>
            <div id="animeList" class="flex-1 overflow-y-auto space-y-3 pr-2">
                <div class="text-zinc-500 text-center py-20 text-sm">Loading catalog from Cloudflare Edge...</div>
            </div>
        </section>

        <section class="lg:col-span-2 flex flex-col gap-6">
            <div class="bg-[#18181b] border border-zinc-800 rounded-xl p-4 flex flex-col">
                <h2 id="currentTitle" class="font-medium text-lg mb-3">Select an anime item</h2>
                <div class="relative w-full aspect-video bg-black rounded-lg overflow-hidden border border-zinc-900 shadow-inner flex items-center justify-center">
                    <video id="videoPlayer" class="w-full h-full" controls crossorigin="anonymous"></video>
                </div>
            </div>

            <div class="bg-[#18181b] border border-zinc-800 rounded-xl p-4">
                <h2 class="text-sm font-semibold text-zinc-400 uppercase tracking-wider mb-3">Resolved Streams</h2>
                <div id="episodeList" class="flex flex-wrap gap-2 max-h-40 overflow-y-auto">
                    <span class="text-zinc-500 text-sm">No anime selected.</span>
                </div>
            </div>
        </section>
    </main>

    <script>
        async function fetchCatalog() {
            const listEl = document.getElementById('animeList');
            listEl.innerHTML = `<div class="text-zinc-400 text-center py-20 text-sm animate-pulse">Fetching from Edge Worker...</div>`;

            try {
                const response = await fetch('/api/extension/popular');
                const json = await response.json();
                if (json.success && json.data && json.data.list) {
                    renderCatalog(json.data.list);
                }
            } catch (err) {
                listEl.innerHTML = `<div class="text-rose-400 text-center py-10 text-sm">Failed to load catalog.</div>`;
            }
        }

        function renderCatalog(items) {
            const listEl = document.getElementById('animeList');
            listEl.innerHTML = '';
            items.forEach(anime => {
                const item = document.createElement('div');
                item.className = "flex items-center gap-3 p-3 bg-zinc-900/60 hover:bg-zinc-800 border border-zinc-800/80 rounded-lg cursor-pointer transition-all";
                item.innerHTML = `
                    <img src="${anime.imageUrl}" class="w-12 h-16 bg-zinc-800 rounded object-cover">
                    <div class="overflow-hidden">
                        <h3 class="font-medium text-sm text-slate-200 truncate">${anime.name}</h3>
                        <p class="text-xs text-zinc-400 mt-0.5">Click to view streams</p>
                    </div>
                `;
                item.onclick = () => selectAnime(anime);
                listEl.appendChild(item);
            });
        }

        async function selectAnime(anime) {
            document.getElementById('currentTitle').innerText = `Resolving: ${anime.name}`;
            const epListEl = document.getElementById('episodeList');
            epListEl.innerHTML = `<span class="text-sky-400 text-sm">Querying edge resolver...</span>`;

            setTimeout(() => {
                epListEl.innerHTML = '';
                const btn = document.createElement('button');
                btn.className = "px-4 py-2 bg-zinc-800 hover:bg-sky-600 hover:text-white rounded-lg text-sm font-medium border border-zinc-700 transition-all";
                btn.innerText = `Stream Episode 1`;
                btn.onclick = () => resolveAndPlayVideo(anime.name);
                epListEl.appendChild(btn);
            }, 300);
        }

        async function resolveAndPlayVideo(title) {
            try {
                const response = await fetch('/api/extension/videos?url=sample');
                const json = await response.json();
                if (json.success && json.data.length > 0) {
                    playVideo(json.data[0].url, title);
                }
            } catch (err) {
                alert("Error fetching stream.");
            }
        }

        function playVideo(url, title) {
            document.getElementById('currentTitle').innerText = `Now Playing: ${title}`;
            const video = document.getElementById('videoPlayer');
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                video.play();
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play();
            }
        }

        fetchCatalog();
    </script>
</body>
</html>
